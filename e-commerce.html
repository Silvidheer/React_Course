<!DOCTYPE html>
<html>
  <head>
    <title>E-Commerce</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ProductDetails(props) {
          const {productName, price, discountedPrice, imageSrc} = props;
          return (
            <>
              <img src={imageSrc} alt={productName} width="100" height="100"/>
              <div>{productName}</div>
              {!discountedPrice ? (
                <div>Price: ${price.toFixed(2)}</div>
              ) : (
                <div>Price: <del>${price.toFixed(2)}</del></div>
              )}
              {discountedPrice && <div>Discounted Price: ${discountedPrice.toFixed(2)}</div>}
              <button>Add to Cart</button>  
            </>
          );
      }
      function App() {
        return (
          <>
            <p align="center">Here are the product details:</p>
            <div align="right">
              <div><ProductDetails productName="Cotton Socks" price={10.90} discountedPrice={8.90} imageSrc="cotton-socks.png"/></div>
              <br/>
              <div><ProductDetails productName="Tennis Ball" price={6.00} imageSrc="tennis-balls.png"/></div>
              <br/>
              <div><ProductDetails productName="Plain T-Shirt" price={7.99} imageSrc="plain-t-shirt.png"/></div>
            </div>
          </>
        );
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
