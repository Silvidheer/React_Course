<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      .body{
        font-family: Arial, sans-serif;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
      }
      .chat-input {
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 15px;
        border-width: 1px;
        flex-grow: 1;
      }
      .chat-input-container {
        margin-bottom: 60px;
        display: flex;
      }
      .app-container {
        max-width: 600px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-message-robot {
        display: flex;
        justify-content: flex-start;
        align-items: start;
      }
      .chat-message-user {
        display: flex;
        justify-content: flex-end;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238, 238);
        margin: 10px;
        padding: 10px;  
        border-radius: 10px;
        max-width: 300px;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages, setChatMessages}) {

        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const newChatMessages = [...chatMessages, {
            message: inputText,
            sender: "user"
          }];
          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(inputText);
          setTimeout(() => {
            setChatMessages(prev => [
              ...prev,
              {
                message: response,
                sender: "robot"
              }
            ]);
          }, 500);
          setInputText("");
        }

        return (
          <div className="chat-input-container">
            <input 
            placeholder="Send a message to chatbot" 
            size="30"
            onChange={saveInputText}
            value={inputText}  
            className="chat-input"   
          />
            <button
            onClick={sendMessage}
            className="send-button">Send</button>
          </div>
        );
      }

      function ChatMessage(props) {
       //const message = props.message;
       //const sender = props.sender;
        const {message, sender} = props;
          return (
            <div className={sender === "robot" ? "chat-message-robot" : "chat-message-user"}>
              {props.sender === "robot" && <img src="robot.png" alt="Robot" width="50" height="50"/>}
              <div className="chat-message-text">
                {props.message}
              </div>
              {props.sender === "user" && <img src="user.png" alt="User" width="50" height="50"/>}
            </div>
          );
      }

      function ChatMessages({chatMessages}) {
        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
          const chatMessagesContainer = chatMessagesRef.current;

          if (chatMessagesContainer) {
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
          }
        }, [chatMessages]);

        return (
          <div ref={chatMessagesRef} className="chat-messages">
            {chatMessages.map((chatMessage, index) => (
              <ChatMessage key={index} message={chatMessage.message} sender={chatMessage.sender}/>
            ))}
          </div>
        );
      }

      function App() {
         const [chatMessages, setChatMessages] = React.useState([
          {message: "hello chatbot", sender: "user"},
          {message: "Hello! how can I help you?", sender: "robot"},
          {message: "I want to know about your services", sender: "user"},
          {message: "We provide web development services", sender: "robot"}
        ]);
        return (
          <div className="app-container">
            
            <ChatMessages chatMessages={
              chatMessages
            }/>
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
